name: ci

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm i
      - name: Unit tests
        run: npm test
      - name: Build app
        run: |
          npm run build
          mkdir -p compiled
          cp -r dist/. compiled/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.github
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nbittich/openartcoded-backoffice:latest
          cache-from: type=registry,ref=nbittich/openartcoded-backoffice:buildcache
          cache-to: type=registry,ref=nbittich/openartcoded-backoffice:buildcache,mode=max

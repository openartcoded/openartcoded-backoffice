user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # runtime config must never be cached
        location = /assets/config/config.json {
            add_header Cache-Control "no-store";
        }

        # hashed build assets can be cached forever
        location /static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri /index.html;
        }

        error_page 404 /index.html;
    }
}
